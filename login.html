<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Groww Charity</title>
    <link rel="icon" type="image/jpeg" href="Assest/groww charity_logo.jpg">

    <meta name="description" content="Login to your Groww Charity account to access philanthropic tools and community impact dashboard.">
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="foundation login, philanthropy, community impact, charitable giving, social work">
    <meta name="author" content="Groww Charity Foundation">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        earth: '#8B4513',
                        sage: '#90A955',
                        sky: '#4A90E2',
                        sun: '#FFB347',
                        clay: '#D2691E',
                        ocean: '#2E8B57',
                        storm: '#4682B4',
                        sand: '#F4A460',
                        'dark-bg': '#0f172a',
                        'dark-card': '#1e293b',
                        'dark-text': '#cbd5e1'
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Nunito', 'sans-serif'],
                    },
                    animation: {
                        'slide-in': 'slideIn 0.5s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'tilt': 'tilt 10s infinite linear',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'shake': 'shake 0.5s ease-in-out',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.8' },
                        },
                        tilt: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(1deg)' },
                            '75%': { transform: 'rotate(-1deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Styles */
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #374151;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #cbd5e1;
        }
        
        /* Geometric Background Pattern */
        .pattern-bg {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 144, 226, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(46, 139, 87, 0.08) 0%, transparent 55%);
        }
        
        .dark .pattern-bg {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 144, 226, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(46, 139, 87, 0.12) 0%, transparent 55%);
        }
        
        /* Custom Button */
        .btn-magnetic {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #2E8B57 0%, #4A90E2 100%);
            color: white;
        }
        
        .btn-magnetic:hover {
            background: linear-gradient(135deg, #257D49 0%, #3a80d2 100%);
            transform: scale(1.05);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #F1F1F1;
        }
        
        .dark ::-webkit-scrollbar-track {
            background: #2D2D2D;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4A90E2;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3a80d2;
        }
        
        /* Auth Card */
        .auth-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid #E5E5E5;
            animation: slideIn 0.5s ease-out;
        }
        
        .dark .auth-card {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        /* Input Styles */
        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 2px solid #E5E5E5;
            background: white;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .dark .form-input {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        
        .dark .form-input:focus {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }
        
        .form-input.error {
            border-color: #EF4444;
            animation: shake 0.5s ease-in-out;
        }
        
        .dark .form-input.error {
            border-color: #F87171;
        }
        
        /* Checkbox */
        .form-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #D1D5DB;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dark .form-checkbox {
            border-color: #4B5563;
            background: #334155;
        }
        
        .form-checkbox:checked {
            background: #4A90E2;
            border-color: #4A90E2;
        }
        
        /* Social Login Buttons */
        .social-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 2px solid #E5E5E5;
            background: white;
            color: #4B5563;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .dark .social-login-btn {
            background: #334155;
            border-color: #475569;
            color: #D1D5DB;
        }
        
        .social-login-btn:hover {
            border-color: #4A90E2;
            color: #4A90E2;
            transform: translateY(-2px);
        }
        
        /* Toggle Buttons */
        .toggle-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            display: flex;
            gap: 0.5rem;
        }
        
        [dir="rtl"] .toggle-container {
            right: auto;
            left: 1rem;
        }
        
        .toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4A90E2;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid #4A90E2;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
        }
        
        .dark .toggle-btn {
            background: #4A90E2;
            color: white;
            border-color: #4A90E2;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        
        .toggle-btn:hover {
            background: #3a80d2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.3);
        }
        
        .toggle-btn.active {
            background: #2E8B57;
            border-color: #2E8B57;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9CA3AF;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E5E5;
        }
        
        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: #475569;
        }
        
        .divider span {
            padding: 0 0.75rem;
        }
        
        /* Error Message */
        .error-message {
            color: #EF4444;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: fadeIn 0.3s ease-out;
        }
        
        .dark .error-message {
            color: #F87171;
        }
        
        /* Success Message */
        .success-message {
            color: #10B981;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Loading State */
        .btn-loading {
            position: relative;
            pointer-events: none;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            right: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Logo Styles */
        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2, #2E8B57);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
            transition: all 0.3s ease;
        }
        
        .dark .logo-circle {
            border-color: #1e293b;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        
        .logo-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.3);
        }
        
        /* Center Container */
        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 1rem;
        }
        
        /* RTL Specific Styles */
        [dir="rtl"] .form-input {
            text-align: right;
        }
        
        [dir="rtl"] .form-input.pl-10 {
            padding-left: 1.25rem;
            padding-right: 2.5rem;
        }
        
        [dir="rtl"] .relative .absolute.inset-y-0.left-0 {
            left: auto;
            right: 0;
        }
        
        [dir="rtl"] .relative .absolute.inset-y-0.right-0 {
            right: auto;
            left: 0;
        }
        
        [dir="rtl"] .flex.items-center.space-x-4 {
            flex-direction: row-reverse;
        }
        
        [dir="rtl"] .text-right {
            text-align: left;
        }
        
        [dir="rtl"] .text-left {
            text-align: right;
        }
        
        [dir="rtl"] .text-center {
            text-align: center;
        }
        
        [dir="rtl"] .flex.justify-between .flex.items-center.space-x-2 {
            flex-direction: row-reverse;
        }
        
        [dir="rtl"] .btn-magnetic .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }
        
        [dir="rtl"] .social-login-btn .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }
        
        [dir="rtl"] .flex.items-start.space-x-4 {
            flex-direction: row-reverse;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .auth-card {
                padding: 1.5rem;
                width: 100%;
                max-width: 400px;
            }
            
            .toggle-btn {
                width: 40px;
                height: 40px;
            }
            
            .logo-circle {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
        }
        
        @media (max-width: 640px) {
            .auth-card {
                padding: 1.25rem;
                border-radius: 16px;
            }
            
            .social-login-btn span {
                font-size: 0.85rem;
            }
            
            .form-input {
                padding: 0.875rem 1rem;
                font-size: 0.9rem;
            }
            
            .logo-circle {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="pattern-bg">
    
    <!-- Toggle Buttons (Theme & RTL) -->
    <div class="toggle-container">
        <button id="theme-toggle" class="toggle-btn" title="Toggle theme">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun hidden"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="Toggle RTL/LTR">
            <i class="fas fa-globe-americas"></i>
        </button>
    </div>
    
    <!-- Main Content - Centered Card -->
    <div class="center-container">
        <div class="auth-card p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <!-- Centered Clickable Logo -->
                <a href="index.html" class="inline-flex flex-col items-center justify-center mb-6">
                    <div class="logo-circle">
                        <i class="fas fa-hands-helping"></i>
                    </div>
                    <h1 class="font-serif text-3xl font-bold text-storm dark:text-sky">Groww Charity</h1>
                </a>
                <p class="text-gray-600 dark:text-gray-300 text-sm">Welcome back! Please sign in to your account</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-800 dark:text-gray-300 mb-2 rtl:text-right">
                        Email Address
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400 text-sm"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            required
                            placeholder="you@example.com"
                            class="form-input pl-10 rtl:pl-0 rtl:pr-10 rtl:text-right"
                            dir="auto"
                        >
                    </div>
                    <div id="email-error" class="error-message hidden">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Please enter a valid email address</span>
                    </div>
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-800 dark:text-gray-300 mb-2 rtl:text-right">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 text-sm"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            required
                            placeholder="••••••••"
                            class="form-input pl-10 rtl:pl-0 rtl:pr-10 rtl:text-right"
                            dir="auto"
                            minlength="6"
                        >
                        <button type="button" class="absolute inset-y-0 right-0 rtl:right-auto rtl:left-0 pr-3 rtl:pr-0 rtl:pl-3 flex items-center" id="togglePassword">
                            <i class="fas fa-eye text-gray-400 text-sm"></i>
                        </button>
                    </div>
                    <div id="password-error" class="error-message hidden">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Password must be at least 6 characters</span>
                    </div>
                    
                    <div class="flex justify-between items-center mt-3">
                        <!-- Remember Me -->
                        <div class="flex items-center text-sm">
                            <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
                                <input type="checkbox" class="form-checkbox">
                                <span class="text-gray-800 dark:text-gray-300">Remember me</span>
                            </label>
                        </div>
                        <a href="#" class="text-sky text-sm hover:text-sky/80 transition">
                            Forgot Password?
                        </a>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" id="login-button" class="btn-magnetic w-full py-3 rounded-lg font-medium mt-2">
                    <i class="fas fa-sign-in-alt mr-2 rtl:mr-0 rtl:ml-2"></i> 
                    <span>Sign In</span>
                </button>
                
                <!-- Login Status Message -->
                <div id="login-status" class="text-center"></div>
            </form>
            
            <!-- Divider -->
            <div class="divider my-6">
                <span class="text-xs text-gray-500 dark:text-gray-400">Or continue with</span>
            </div>
            
            <!-- Social Login -->
            <div class="grid grid-cols-3 gap-3">
                <button class="social-login-btn">
                    <i class="fab fa-google text-red-500"></i>
                </button>
                <button class="social-login-btn">
                    <i class="fab fa-facebook-f text-blue-600"></i>
                </button>
                <button class="social-login-btn">
                    <i class="fab fa-linkedin-in text-blue-700"></i>
                </button>
            </div>
            
            <!-- Sign Up Link -->
            <div class="text-center mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 text-sm">
                <p class="text-gray-600 dark:text-gray-300">
                    Don't have an account?
                    <a
                        href="Signup.html"
                        class="text-sky font-medium hover:text-sky/80 transition"
                        onclick="event.stopPropagation();"
                    >
                        Sign up
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Initialize theme
        function initTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = themeToggle.querySelector('.fa-moon');
            const themeIconSun = themeToggle.querySelector('.fa-sun');
            
            // Check saved theme or system preference
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                themeIcon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
                themeToggle.classList.add('active');
                localStorage.setItem('theme', 'dark');
            }
            
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                document.body.classList.toggle('dark');
                
                if (document.documentElement.classList.contains('dark')) {
                    themeIcon.classList.add('hidden');
                    themeIconSun.classList.remove('hidden');
                    themeToggle.classList.add('active');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeIcon.classList.remove('hidden');
                    themeIconSun.classList.add('hidden');
                    themeToggle.classList.remove('active');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
        
        // Initialize RTL
        function initRTL() {
            const rtlToggle = document.getElementById('rtl-toggle');
            const htmlElement = document.documentElement;
            
            // Check saved RTL
            if (localStorage.getItem('direction') === 'rtl') {
                document.documentElement.dir = 'rtl';
                document.documentElement.lang = 'ar';
                rtlToggle.classList.add('active');
            }
            
            rtlToggle.addEventListener('click', () => {
                const currentDir = htmlElement.dir || 'ltr';
                const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
                
                document.documentElement.dir = newDir;
                document.documentElement.lang = newDir === 'rtl' ? 'ar' : 'en';
                
                if (newDir === 'rtl') {
                    rtlToggle.classList.add('active');
                } else {
                    rtlToggle.classList.remove('active');
                }
                
                localStorage.setItem('direction', newDir);
                updateInputDirections();
            });
        }
        
        // Update input text directions
        function updateInputDirections() {
            const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
            inputs.forEach(input => {
                input.dir = document.documentElement.dir === 'rtl' ? 'rtl' : 'ltr';
            });
        }
        
        // Toggle Password Visibility
        function initPasswordToggle() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const icon = togglePassword.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        }
        
        // Form Validation
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function validatePassword(password) {
            return password.length >= 6;
        }
        
        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            
            if (errorElement && inputElement) {
                errorElement.querySelector('span').textContent = message;
                errorElement.classList.remove('hidden');
                inputElement.classList.add('error');
            }
        }
        
        function hideError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            
            if (errorElement && inputElement) {
                errorElement.classList.add('hidden');
                inputElement.classList.remove('error');
            }
        }
        
        function showSuccess(message) {
            const statusElement = document.getElementById('login-status');
            if (statusElement) {
                statusElement.innerHTML = `
                    <div class="success-message p-2 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
                        <i class="fas fa-check-circle mr-2"></i>
                        <span>${message}</span>
                    </div>
                `;
                
                // Clear after 3 seconds
                setTimeout(() => {
                    statusElement.innerHTML = '';
                }, 3000);
            }
        }
        
        function showFormError(message) {
            const statusElement = document.getElementById('login-status');
            if (statusElement) {
                statusElement.innerHTML = `
                    <div class="error-message p-2 bg-red-50 dark:bg-red-900/20 rounded-lg border border-red-200 dark:border-red-800">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span>${message}</span>
                    </div>
                `;
                
                // Clear after 5 seconds
                setTimeout(() => {
                    statusElement.innerHTML = '';
                }, 5000);
            }
        }
        
        // Form Submission
        function initFormSubmission() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('login-button');
            const rememberMe = document.querySelector('input[type="checkbox"]');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    
                    // Reset errors
                    hideError('email');
                    hideError('password');
                    
                    // Validate email
                    if (!validateEmail(email)) {
                        showError('email', 'Please enter a valid email address');
                        return;
                    }
                    
                    // Validate password
                    if (!validatePassword(password)) {
                        showError('password', 'Password must be at least 6 characters');
                        return;
                    }
                    
                    // Show loading state
                    loginButton.classList.add('btn-loading');
                    loginButton.disabled = true;
                    loginButton.innerHTML = '<span>Signing In...</span>';
                    
                    // Simulate API call
                    try {
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        
                        // For demonstration, any valid email and password (6+ chars) will work
                        if (password.length >= 6) {
                            // Save to localStorage if remember me is checked
                            if (rememberMe.checked) {
                                localStorage.setItem('rememberedEmail', email);
                            } else {
                                localStorage.removeItem('rememberedEmail');
                            }
                            
                            // Save login state
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('userEmail', email);
                            
                            showSuccess('Login successful! Redirecting...');
                            
                            // Redirect to home page after 1.5 seconds
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 1500);
                        } else {
                            showFormError('Password must be at least 6 characters long');
                        }
                    } catch (error) {
                        showFormError('Login failed. Please try again.');
                    } finally {
                        // Reset button state
                        loginButton.classList.remove('btn-loading');
                        loginButton.disabled = false;
                        loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2 rtl:mr-0 rtl:ml-2"></i><span>Sign In</span>';
                    }
                });
            }
            
            // Auto-fill email if remembered
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.querySelector('input[type="checkbox"]').checked = true;
            }
        }
        
        // Real-time validation
        function initRealTimeValidation() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            if (emailInput) {
                emailInput.addEventListener('input', () => {
                    if (emailInput.value.trim() === '') {
                        hideError('email');
                    } else if (!validateEmail(emailInput.value.trim())) {
                        showError('email', 'Please enter a valid email address');
                    } else {
                        hideError('email');
                    }
                });
            }
            
            if (passwordInput) {
                passwordInput.addEventListener('input', () => {
                    if (passwordInput.value === '') {
                        hideError('password');
                    } else if (!validatePassword(passwordInput.value)) {
                        showError('password', 'Password must be at least 6 characters');
                    } else {
                        hideError('password');
                    }
                });
            }
        }
        
        // Social login handlers
        function initSocialLogin() {
            document.querySelectorAll('.social-login-btn').forEach(button => {
                button.addEventListener('click', () => {
                    // Show loading state
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    button.disabled = true;
                    
                    // Simulate social login and redirect to home
                    setTimeout(() => {
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('socialLogin', 'true');
                        window.location.href = 'index.html';
                    }, 2000);
                });
            });
        }
        
        // Initialize everything when DOM loads
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initRTL();
            initPasswordToggle();
            initFormSubmission();
            initRealTimeValidation();
            initSocialLogin();
            
            // Set initial input directions
            updateInputDirections();
            
            // Ensure no scrollbars
            document.body.style.overflow = 'hidden';
        });
    </script>
</body>
</html>
