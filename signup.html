<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Groww Charity</title>
    <link rel="icon" type="image/jpeg" href="Assest/growwpark_logo.jpg">

    <meta name="description" content="Create your Groww Charity account to start making a difference in communities.">
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="foundation signup, philanthropy, charitable giving, community impact, social work">
    <meta name="author" content="Groww Charity">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        earth: '#8B4513',
                        sage: '#90A955',
                        sky: '#4A90E2',
                        sun: '#FFB347',
                        clay: '#D2691E',
                        ocean: '#2E8B57',
                        storm: '#4682B4',
                        sand: '#F4A460',
                        'dark-bg': '#0f172a',
                        'dark-card': '#1e293b',
                        'dark-text': '#cbd5e1'
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Nunito', 'sans-serif'],
                    },
                    animation: {
                        'slide-in': 'slideIn 0.5s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'tilt': 'tilt 10s infinite linear',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'shake': 'shake 0.5s ease-in-out',
                        'card-float': 'cardFloat 3s ease-in-out infinite',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.8' },
                        },
                        tilt: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(1deg)' },
                            '75%': { transform: 'rotate(-1deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' }
                        },
                        cardFloat: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Styles */
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #374151;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            overflow-y: auto;
        }
        
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #cbd5e1;
        }
        
        /* Geometric Background Pattern */
        .pattern-bg {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 144, 226, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(46, 139, 87, 0.08) 0%, transparent 55%);
        }
        
        .dark .pattern-bg {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(74, 144, 226, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(46, 139, 87, 0.12) 0%, transparent 55%);
        }
        
        /* Custom Button */
        .btn-magnetic {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            background: linear-gradient(135deg, #2E8B57 0%, #4A90E2 100%);
            color: white;
        }
        
        .btn-magnetic:hover {
            background: linear-gradient(135deg, #257D49 0%, #3a80d2 100%);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }
        
        /* Auth Card - SMALLER SIZE */
        .auth-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #E5E5E5;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            transform: translateY(0);
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 20px auto;
        }
        
        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }
        
        .dark .auth-card {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .dark .auth-card:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        
        /* Input Styles */
        .form-input {
            width: 100%;
            padding: 0.75rem 0.875rem;
            border-radius: 10px;
            border: 2px solid #E5E5E5;
            background: white;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        
        .dark .form-input {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
            transform: translateY(-1px);
        }
        
        .dark .form-input:focus {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }
        
        .form-input.error {
            border-color: #EF4444;
            animation: shake 0.5s ease-in-out;
        }
        
        .dark .form-input.error {
            border-color: #F87171;
        }
        
        /* Checkbox */
        .form-checkbox {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 2px solid #D1D5DB;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dark .form-checkbox {
            border-color: #475569;
            background: #334155;
        }
        
        .form-checkbox:checked {
            background: #4A90E2;
            border-color: #4A90E2;
        }
        
        /* Social Signup Buttons - One Row */
        .social-signup-container {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        
        .social-signup-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem;
            border-radius: 10px;
            border: 2px solid #E5E5E5;
            background: white;
            color: #4B5563;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            font-size: 0.8rem;
        }
        
        .dark .social-signup-btn {
            background: #334155;
            border-color: #475569;
            color: #D1D5DB;
        }
        
        .social-signup-btn:hover {
            border-color: #4A90E2;
            color: #4A90E2;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        
        /* Toggle Buttons - Positioned at top right */
        .toggle-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            gap: 0.5rem;
        }
        
        /* Individual toggle buttons with sky blue theme */
        .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4A90E2;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid #4A90E2;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            font-size: 0.85rem;
        }
        
        .rtl-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4A90E2;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid #4A90E2;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            font-weight: bold;
            font-size: 0.85rem;
        }
        
        .dark .theme-toggle-btn,
        .dark .rtl-toggle-btn {
            background: #4A90E2;
            color: white;
            border-color: #4A90E2;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }
        
        .theme-toggle-btn:hover,
        .rtl-toggle-btn:hover {
            background: #3a80d2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(74, 144, 226, 0.3);
        }
        
        .theme-toggle-btn.active,
        .rtl-toggle-btn.active {
            background: #2E8B57;
            color: white;
            border-color: #2E8B57;
        }
        
        [dir="rtl"] .toggle-container {
            right: auto;
            left: 1rem;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9CA3AF;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E5E5;
        }
        
        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: #475569;
        }
        
        .divider span {
            padding: 0 0.75rem;
            font-size: 0.8rem;
        }
        
        /* Logo container - CENTERED */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease;
            flex-direction: column;
        }
        
        .logo-container:hover {
            transform: translateY(-2px);
        }
        
        /* Round logo */
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2, #2E8B57);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-bottom: 0.5rem;
        }
        
        .logo-container:hover .logo-circle {
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(74, 144, 226, 0.3);
        }
        
        .dark .logo-circle {
            border-color: #1e293b;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #4682B4;
            line-height: 1.2;
        }
        
        .logo-text p {
            font-size: 0.75rem;
            color: #64748b;
        }
        
        .dark .logo-text h1 {
            color: #4A90E2;
        }
        
        .dark .logo-text p {
            color: #94a3b8;
        }
        
        /* RTL Specific Styles */
        [dir="rtl"] .form-input {
            text-align: right;
        }
        
        [dir="rtl"] .form-input.pl-10 {
            padding-left: 0.875rem;
            padding-right: 2.25rem;
        }
        
        [dir="rtl"] .relative .absolute.inset-y-0.left-0 {
            left: auto;
            right: 0;
        }
        
        [dir="rtl"] .relative .absolute.inset-y-0.right-0 {
            right: auto;
            left: 0;
        }
        
        [dir="rtl"] .flex.items-center.space-x-4 {
            flex-direction: row-reverse;
        }
        
        [dir="rtl"] .text-right {
            text-align: left;
        }
        
        [dir="rtl"] .text-left {
            text-align: right;
        }
        
        [dir="rtl"] .text-center {
            text-align: center;
        }
        
        [dir="rtl"] .flex.justify-between .flex.items-center.space-x-2 {
            flex-direction: row-reverse;
        }
        
        [dir="rtl"] .btn-magnetic .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }
        
        [dir="rtl"] .social-signup-btn .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }
        
        [dir="rtl"] .flex.items-start.space-x-4 {
            flex-direction: row-reverse;
        }
        
        /* Error Message */
        .error-message {
            color: #EF4444;
            font-size: 0.7rem;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: fadeIn 0.3s ease-out;
        }
        
        .dark .error-message {
            color: #F87171;
        }
        
        /* Success Message */
        .success-message {
            color: #10B981;
            font-size: 0.7rem;
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Loading State */
        .btn-loading {
            position: relative;
            pointer-events: none;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            right: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Main Container */
        .main-container {
            min-height: calc(100vh - 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 1rem;
        }
        
        /* Terms Link - No Underline */
        .terms-link {
            color: #4A90E2;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.85rem;
        }
        
        .terms-link:hover {
            color: #3a80d2;
        }
        
        /* Validation messages */
        .validation-message {
            font-size: 0.7rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .validation-message.valid {
            color: #10b981;
        }
        
        .validation-message.invalid {
            color: #ef4444;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .main-container {
                padding: 15px 1rem;
            }
            
            .toggle-container {
                top: 0.75rem;
                right: 0.75rem;
            }
            
            .theme-toggle-btn,
            .rtl-toggle-btn {
                width: 36px;
                height: 36px;
                font-size: 0.8rem;
            }
            
            .auth-card {
                padding: 1.25rem;
                border-radius: 20px;
                max-width: 380px;
            }
            
            .form-input {
                padding: 0.7rem;
                font-size: 0.8rem;
            }
            
            .logo-circle {
                width: 55px;
                height: 55px;
                font-size: 22px;
            }
            
            .logo-text h1 {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 640px) {
            .main-container {
                padding: 10px 0.75rem;
            }
            
            .auth-card {
                padding: 1rem;
                border-radius: 18px;
                max-width: 340px;
            }
            
            .form-input {
                padding: 0.65rem;
                font-size: 0.8rem;
            }
            
            .logo-container {
                gap: 0.5rem;
                margin-bottom: 0.75rem;
            }
            
            .logo-circle {
                width: 50px;
                height: 50px;
                font-size: 20px;
                margin-bottom: 0.5rem;
            }
            
            .logo-text h1 {
                font-size: 1.4rem;
            }
            
            .toggle-container {
                top: 0.5rem;
                right: 0.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: 0.875rem;
                max-width: 300px;
            }
            
            .logo-circle {
                width: 45px;
                height: 45px;
                font-size: 18px;
                margin-bottom: 0.4rem;
            }
            
            .logo-text h1 {
                font-size: 1.3rem;
            }
            
            body {
                padding: 10px 0;
            }
            
            .main-container {
                min-height: calc(100vh - 20px);
                padding: 10px 0.5rem;
            }
        }
        
        /* Ensure social buttons stay in one row */
        .social-signup-container {
            flex-direction: row !important;
            flex-wrap: nowrap;
        }
        
        /* Make social buttons equal width */
        .social-signup-btn {
            flex: 1;
            min-width: 0;
        }
        
        /* Ensure body doesn't overflow */
        html, body {
            overflow-x: hidden;
        }
    </style>
</head>
<body class="pattern-bg animate-fade-in">
    
    <!-- Toggle Buttons -->
    <div class="toggle-container">
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle theme">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun hidden"></i>
        </button>
        <button id="rtl-toggle" class="rtl-toggle-btn" title="Toggle RTL/LTR">
            <i class="fas fa-globe-americas"></i>
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="w-full max-w-md mx-auto px-4">
            <!-- Centered Signup Form -->
            <div class="animate-slide-in">
                <div class="auth-card p-5">
                    <!-- Logo - CENTERED -->
                    <div class="flex flex-col items-center mb-4">
                        <a class='logo-container' href='index.html' title="Go to Home">
                            <div class="logo-circle">
                                <i class="fas fa-hands-helping"></i>
                            </div>
                            <div class="logo-text">
                                <h1>Groww Charity</h1>
                                <p class="text-xs text-gray-600 dark:text-gray-400 mt-0.5">Join our community</p>
                            </div>
                        </a>
                    </div>
                    
                    <!-- Title -->
                    <div class="mb-5 text-center">
                        <h2 class="font-serif text-xl font-bold text-gray-800 dark:text-white mb-1.5">
                            Create your account
                        </h2>
                        <p class="text-gray-600 dark:text-gray-300 text-sm">
                            Join us today and start making a difference
                        </p>
                    </div>
                    
                    <form id="signupForm" class="space-y-3">
                        <!-- Name -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label for="firstName" class="block text-xs font-medium text-gray-800 dark:text-gray-300 mb-1 rtl:text-right">
                                    First Name
                                </label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                                        <i class="fas fa-user text-gray-400 text-xs"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        id="firstName" 
                                        name="firstName"
                                        required
                                        placeholder="John"
                                        class="form-input pl-9 rtl:pl-0 rtl:pr-9 rtl:text-right"
                                        dir="auto"
                                    >
                                </div>
                                <div id="firstName-error" class="error-message hidden">
                                    <i class="fas fa-exclamation-circle text-xs"></i>
                                    <span class="text-xs">First name is required</span>
                                </div>
                            </div>
                            <div>
                                <label for="lastName" class="block text-xs font-medium text-gray-800 dark:text-gray-300 mb-1 rtl:text-right">
                                    Last Name
                                </label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                                        <i class="fas fa-user text-gray-400 text-xs"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        id="lastName" 
                                        name="lastName"
                                        required
                                        placeholder="Doe"
                                        class="form-input pl-9 rtl:pl-0 rtl:pr-9 rtl:text-right"
                                        dir="auto"
                                    >
                                </div>
                                <div id="lastName-error" class="error-message hidden">
                                    <i class="fas fa-exclamation-circle text-xs"></i>
                                    <span class="text-xs">Last name is required</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label for="email" class="block text-xs font-medium text-gray-800 dark:text-gray-300 mb-1 rtl:text-right">
                                Email Address
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                                    <i class="fas fa-envelope text-gray-400 text-xs"></i>
                                </div>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email"
                                    required
                                    placeholder="you@example.com"
                                    class="form-input pl-9 rtl:pl-0 rtl:pr-9 rtl:text-right"
                                    dir="auto"
                                >
                            </div>
                            <div id="email-error" class="error-message hidden">
                                <i class="fas fa-exclamation-circle text-xs"></i>
                                <span class="text-xs">Please enter a valid email address</span>
                            </div>
                            <div id="email-validation" class="validation-message"></div>
                        </div>
                        
                        <!-- Password -->
                        <div>
                            <label for="password" class="block text-xs font-medium text-gray-800 dark:text-gray-300 mb-1 rtl:text-right">
                                Password
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                                    <i class="fas fa-lock text-gray-400 text-xs"></i>
                                </div>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password"
                                    required
                                    placeholder="••••••••"
                                    class="form-input pl-9 rtl:pl-0 rtl:pr-9 rtl:text-right"
                                    dir="auto"
                                    minlength="8"
                                >
                                <button type="button" class="absolute inset-y-0 right-0 rtl:right-auto rtl:left-0 pr-3 rtl:pr-0 rtl:pl-3 flex items-center" id="togglePassword">
                                    <i class="fas fa-eye text-gray-400 text-xs"></i>
                                </button>
                            </div>
                            <div id="password-error" class="error-message hidden">
                                <i class="fas fa-exclamation-circle text-xs"></i>
                                <span class="text-xs">Password must be at least 8 characters</span>
                            </div>
                            <div id="password-validation" class="validation-message"></div>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div>
                            <label for="confirmPassword" class="block text-xs font-medium text-gray-800 dark:text-gray-300 mb-1 rtl:text-right">
                                Confirm Password
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3 rtl:pl-0 rtl:pr-3 flex items-center pointer-events-none">
                                    <i class="fas fa-lock text-gray-400 text-xs"></i>
                                </div>
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword"
                                    required
                                    placeholder="••••••••"
                                    class="form-input pl-9 rtl:pl-0 rtl:pr-9 rtl:text-right"
                                    dir="auto"
                                    minlength="8"
                                >
                                <button type="button" class="absolute inset-y-0 right-0 rtl:right-auto rtl:left-0 pr-3 rtl:pr-0 rtl:pl-3 flex items-center" id="toggleConfirmPassword">
                                    <i class="fas fa-eye text-gray-400 text-xs"></i>
                                </button>
                            </div>
                            <div id="confirm-password-error" class="error-message hidden">
                                <i class="fas fa-exclamation-circle text-xs"></i>
                                <span class="text-xs">Passwords do not match</span>
                            </div>
                            <div id="confirm-password-validation" class="validation-message"></div>
                        </div>
                        
                        <!-- Terms -->
                        <div class="flex items-start space-x-2 rtl:space-x-reverse text-xs">
                            <input type="checkbox" id="terms" class="form-checkbox mt-0.5" required>
                            <label for="terms" class="text-gray-800 dark:text-gray-300 rtl:text-right text-xs">
                                I agree to the 
                                <a href="#" class="terms-link text-xs">Terms and Conditions</a> 
                                and 
                                <a href="#" class="terms-link text-xs">Privacy Policy</a>
                            </label>
                        </div>
                        <div id="terms-validation" class="validation-message"></div>
                        
                    
                        <!-- Submit Button -->
                        <button type="submit" id="signup-button" class="btn-magnetic w-full py-2.5 rounded-lg font-medium text-sm mt-1">
                            <i class="fas fa-user-plus mr-2 rtl:mr-0 rtl:ml-2 text-xs"></i> Create Account
                        </button>
                        
                        <!-- Signup Status Message -->
                        <div id="signup-status" class="text-center mt-1"></div>
                    </form>
                    
                    <!-- Divider -->
                    <div class="divider my-4">
                        <span class="text-xs text-gray-500 dark:text-gray-400">Or sign up with</span>
                    </div>
                    
                    <!-- Social Signup - ONE ROW -->
                    <div class="social-signup-container">
                        <button class="social-signup-btn">
                            <i class="fab fa-google text-red-500 text-xs"></i>
                            <span class="text-xs ml-1.5">Google</span>
                        </button>
                        <button class="social-signup-btn">
                            <i class="fab fa-facebook-f text-blue-600 text-xs"></i>
                            <span class="text-xs ml-1.5">Facebook</span>
                        </button>
                        <button class="social-signup-btn">
                            <i class="fab fa-linkedin-in text-blue-700 text-xs"></i>
                            <span class="text-xs ml-1.5">LinkedIn</span>
                        </button>
                    </div>
                    
                    <!-- Login Link -->
                    <div class="text-center mt-4 pt-3 border-t border-gray-200 dark:border-gray-700 text-xs">
                        <p class="text-gray-600 dark:text-gray-300">
                            Already have an account? 
                            <a class='terms-link font-medium text-xs' href='login.html'>
                                Sign in here
                            </a>
                        </p>
                    </div>
                </div>
                
                <!-- Security Note -->
              
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Initialize theme
        function initTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = themeToggle.querySelector('.fa-moon');
            const themeIconSun = themeToggle.querySelector('.fa-sun');
            
            // Check saved theme or system preference
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
                themeIcon.classList.add('hidden');
                themeIconSun.classList.remove('hidden');
                themeToggle.classList.add('active');
                localStorage.setItem('theme', 'dark');
            }
            
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                document.body.classList.toggle('dark');
                
                if (document.documentElement.classList.contains('dark')) {
                    themeIcon.classList.add('hidden');
                    themeIconSun.classList.remove('hidden');
                    themeToggle.classList.add('active');
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeIcon.classList.remove('hidden');
                    themeIconSun.classList.add('hidden');
                    themeToggle.classList.remove('active');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
        
        // Initialize RTL
        function initRTL() {
            const rtlToggle = document.getElementById('rtl-toggle');
            const htmlElement = document.documentElement;
            
            // Check saved RTL
            if (localStorage.getItem('direction') === 'rtl') {
                document.documentElement.dir = 'rtl';
                document.documentElement.lang = 'ar';
                rtlToggle.classList.add('active');
                rtlToggle.innerHTML = '<i class="fas fa-language"></i>';
            }
            
            rtlToggle.addEventListener('click', () => {
                const currentDir = htmlElement.dir || 'ltr';
                const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
                
                document.documentElement.dir = newDir;
                document.documentElement.lang = newDir === 'rtl' ? 'ar' : 'en';
                
                if (newDir === 'rtl') {
                    rtlToggle.classList.add('active');
                    rtlToggle.innerHTML = '<i class="fas fa-language"></i>';
                } else {
                    rtlToggle.classList.remove('active');
                    rtlToggle.innerHTML = '<i class="fas fa-globe-americas"></i>';
                }
                
                localStorage.setItem('direction', newDir);
                updateInputDirections();
            });
        }
        
        // Update input text directions
        function updateInputDirections() {
            const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
            inputs.forEach(input => {
                input.dir = document.documentElement.dir === 'rtl' ? 'rtl' : 'ltr';
            });
        }
        
        // Toggle Password Visibility
        function initPasswordToggle() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const icon = togglePassword.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
            
            if (toggleConfirmPassword && confirmPasswordInput) {
                toggleConfirmPassword.addEventListener('click', () => {
                    const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    confirmPasswordInput.setAttribute('type', type);
                    const icon = toggleConfirmPassword.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        }
        
        // Form Validation
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function validatePassword(password) {
            return password.length >= 8;
        }
        
        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            
            if (errorElement && inputElement) {
                errorElement.querySelector('span').textContent = message;
                errorElement.classList.remove('hidden');
                inputElement.classList.add('error');
            }
        }
        
        function hideError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            
            if (errorElement && inputElement) {
                errorElement.classList.add('hidden');
                inputElement.classList.remove('error');
            }
        }
        
        function showValidationMessage(elementId, message, isValid) {
            const validationElement = document.getElementById(elementId);
            if (validationElement) {
                validationElement.textContent = message;
                validationElement.className = `validation-message ${isValid ? 'valid' : 'invalid'}`;
            }
        }
        
        // Password Validation (without strength indicator)
        function validatePasswordWithMessage(password) {
            const validationElement = document.getElementById('password-validation');
            if (!password) {
                showValidationMessage('password-validation', '', false);
                return false;
            }
            
            if (!validatePassword(password)) {
                showValidationMessage('password-validation', 'Password must be at least 8 characters', false);
                return false;
            } else {
                showValidationMessage('password-validation', 'Password is valid', true);
                return true;
            }
        }
        
        // Email Validation
        function validateEmailWithMessage(email) {
            const validationElement = document.getElementById('email-validation');
            if (!email) {
                showValidationMessage('email-validation', '', false);
                return false;
            }
            
            if (!validateEmail(email)) {
                showValidationMessage('email-validation', 'Please enter a valid email address', false);
                return false;
            } else {
                showValidationMessage('email-validation', 'Valid email address', true);
                return true;
            }
        }
        
        // Password Match Validation
        function validatePasswordMatch(password, confirmPassword) {
            const validationElement = document.getElementById('confirm-password-validation');
            if (!confirmPassword) {
                showValidationMessage('confirm-password-validation', '', false);
                return false;
            }
            
            if (password !== confirmPassword) {
                showValidationMessage('confirm-password-validation', 'Passwords do not match', false);
                return false;
            } else {
                showValidationMessage('confirm-password-validation', 'Passwords match', true);
                return true;
            }
        }
        
        // Terms Validation
        function validateTerms(termsChecked) {
            const validationElement = document.getElementById('terms-validation');
            if (!termsChecked) {
                showValidationMessage('terms-validation', 'You must agree to the terms and conditions', false);
                return false;
            } else {
                showValidationMessage('terms-validation', '', true);
                return true;
            }
        }
        
        function showSuccess(message) {
            const statusElement = document.getElementById('signup-status');
            if (statusElement) {
                statusElement.innerHTML = `
                    <div class="success-message p-1.5 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
                        <i class="fas fa-check-circle mr-1.5 rtl:mr-0 rtl:ml-1.5 text-xs"></i>
                        <span class="text-xs">${message}</span>
                    </div>
                `;
                
                // Clear after 3 seconds
                setTimeout(() => {
                    statusElement.innerHTML = '';
                }, 3000);
            }
        }
        
        function showFormError(message) {
            const statusElement = document.getElementById('signup-status');
            if (statusElement) {
                statusElement.innerHTML = `
                    <div class="error-message p-1.5 bg-red-50 dark:bg-red-900/20 rounded-lg border border-red-200 dark:border-red-800">
                        <i class="fas fa-exclamation-circle mr-1.5 rtl:mr-0 rtl:ml-1.5 text-xs"></i>
                        <span class="text-xs">${message}</span>
                    </div>
                `;
                
                // Clear after 5 seconds
                setTimeout(() => {
                    statusElement.innerHTML = '';
                }, 5000);
            }
        }
        
        // Form Submission
        function initFormSubmission() {
            const signupForm = document.getElementById('signupForm');
            const signupButton = document.getElementById('signup-button');
            
            if (signupForm) {
                signupForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const firstName = document.getElementById('firstName').value.trim();
                    const lastName = document.getElementById('lastName').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const termsAccepted = document.getElementById('terms').checked;
                    
                    // Reset errors
                    hideError('firstName');
                    hideError('lastName');
                    hideError('email');
                    hideError('password');
                    hideError('confirm-password');
                    
                    // Validate first name
                    if (!firstName) {
                        showError('firstName', 'First name is required');
                        return;
                    }
                    
                    // Validate last name
                    if (!lastName) {
                        showError('lastName', 'Last name is required');
                        return;
                    }
                    
                    // Validate email
                    if (!validateEmail(email)) {
                        showError('email', 'Please enter a valid email address');
                        return;
                    }
                    
                    // Validate password
                    if (!validatePassword(password)) {
                        showError('password', 'Password must be at least 8 characters');
                        return;
                    }
                    
                    // Validate password confirmation
                    if (password !== confirmPassword) {
                        showError('confirm-password', 'Passwords do not match');
                        return;
                    }
                    
                    // Validate terms
                    if (!termsAccepted) {
                        showFormError('You must agree to the Terms and Conditions and Privacy Policy');
                        return;
                    }
                    
                    // Show loading state
                    signupButton.classList.add('btn-loading');
                    signupButton.disabled = true;
                    signupButton.innerHTML = '<span class="text-sm">Creating Account...</span>';
                    
                    // Simulate API call
                    try {
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        
                        // Save user data to localStorage (simulating account creation)
                        const userData = {
                            firstName,
                            lastName,
                            email,
                            createdAt: new Date().toISOString(),
                            role: 'donor'
                        };
                        
                        localStorage.setItem('foundationUserData', JSON.stringify(userData));
                        localStorage.setItem('foundationUserEmail', email);
                        
                        showSuccess('Account created successfully! Welcome to Groww Charity.');
                        
                        // Redirect to login page after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'Login.html';
                        }, 2000);
                        
                    } catch (error) {
                        showFormError('Signup failed. Please try again.');
                    } finally {
                        // Reset button state
                        signupButton.classList.remove('btn-loading');
                        signupButton.disabled = false;
                        signupButton.innerHTML = '<i class="fas fa-user-plus mr-2 rtl:mr-0 rtl:ml-2 text-sm"></i><span class="text-sm">Create Account</span>';
                    }
                });
            }
        }
        
        // Real-time validation
        function initRealTimeValidation() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const termsCheckbox = document.getElementById('terms');
            
            if (emailInput) {
                emailInput.addEventListener('input', () => {
                    if (emailInput.value.trim() === '') {
                        hideError('email');
                        showValidationMessage('email-validation', '', false);
                    } else if (!validateEmail(emailInput.value.trim())) {
                        showError('email', 'Please enter a valid email address');
                        showValidationMessage('email-validation', 'Please enter a valid email address', false);
                    } else {
                        hideError('email');
                        showValidationMessage('email-validation', 'Valid email address', true);
                    }
                });
            }
            
            if (passwordInput) {
                passwordInput.addEventListener('input', () => {
                    if (passwordInput.value === '') {
                        hideError('password');
                        showValidationMessage('password-validation', '', false);
                    } else if (!validatePassword(passwordInput.value)) {
                        showError('password', 'Password must be at least 8 characters');
                        showValidationMessage('password-validation', 'Password must be at least 8 characters', false);
                    } else {
                        hideError('password');
                        showValidationMessage('password-validation', 'Password is valid', true);
                    }
                    
                    // Validate password match
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    if (confirmPassword) {
                        validatePasswordMatch(passwordInput.value, confirmPassword);
                    }
                });
            }
            
            if (confirmPasswordInput) {
                confirmPasswordInput.addEventListener('input', () => {
                    const password = document.getElementById('password').value;
                    if (confirmPasswordInput.value === '') {
                        hideError('confirm-password');
                        showValidationMessage('confirm-password-validation', '', false);
                    } else if (confirmPasswordInput.value !== password) {
                        showError('confirm-password', 'Passwords do not match');
                        showValidationMessage('confirm-password-validation', 'Passwords do not match', false);
                    } else {
                        hideError('confirm-password');
                        showValidationMessage('confirm-password-validation', 'Passwords match', true);
                    }
                });
            }
            
            if (termsCheckbox) {
                termsCheckbox.addEventListener('change', () => {
                    validateTerms(termsCheckbox.checked);
                });
            }
        }
        
        // Social signup handlers
        function initSocialSignup() {
            document.querySelectorAll('.social-signup-btn').forEach(button => {
                button.addEventListener('click', () => {
                    // Show loading state
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i><span class="ml-1.5 text-xs">Connecting...</span>';
                    button.disabled = true;
                    
                    // Simulate social signup and redirect to login
                    setTimeout(() => {
                        localStorage.setItem('socialSignup', 'true');
                        window.location.href = 'Login.html';
                    }, 2000);
                });
            });
        }
        
        // Initialize everything when DOM loads
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initRTL();
            initPasswordToggle();
            initFormSubmission();
            initRealTimeValidation();
            initSocialSignup();
            
            // Set initial input directions
            updateInputDirections();
            
            // Add entrance animation for the card
            setTimeout(() => {
                const authCard = document.querySelector('.auth-card');
                if (authCard) {
                    authCard.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    authCard.style.transform = 'translateY(20px)';
                    authCard.style.opacity = '0';
                    
                    // Trigger reflow
                    void authCard.offsetWidth;
                    
                    // Animate to final position
                    authCard.style.transform = 'translateY(0)';
                    authCard.style.opacity = '1';
                }
            }, 100);
            
            // Ensure body doesn't overflow
            document.body.style.overflow = 'auto';
        });
    </script>
</body>
</html>
